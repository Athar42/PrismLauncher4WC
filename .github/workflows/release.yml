name: Build Application and Make Release

on:
  push:
    tags:
      - "*"
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "true"
          path: "WinterCupLauncher-source"
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/WinterCupLauncher-source WinterCupLauncher-${{ env.VERSION }}
          mv WinterCupLauncher-Linux-Qt6-Portable*/WinterCupLauncher-portable.tar.gz WinterCupLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv WinterCupLauncher-Linux-aarch64-Qt6-Portable*/WinterCupLauncher-portable.tar.gz WinterCupLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv WinterCupLauncher-*.AppImage/WinterCupLauncher-*-x86_64.AppImage WinterCupLauncher-Linux-x86_64.AppImage
          mv WinterCupLauncher-*.AppImage.zsync/WinterCupLauncher-*-x86_64.AppImage.zsync WinterCupLauncher-Linux-x86_64.AppImage.zsync
          mv WinterCupLauncher-*.AppImage/WinterCupLauncher-*-aarch64.AppImage WinterCupLauncher-Linux-aarch64.AppImage
          mv WinterCupLauncher-*.AppImage.zsync/WinterCupLauncher-*-aarch64.AppImage.zsync WinterCupLauncher-Linux-aarch64.AppImage.zsync
          mv WinterCupLauncher-macOS*/WinterCupLauncher.zip WinterCupLauncher-macOS-${{ env.VERSION }}.zip
          mv WinterCupLauncher-macOS*/WinterCupLauncher.dmg WinterCupLauncher-macOS-${{ env.VERSION }}.dmg

          tar --exclude='.git' -czf WinterCupLauncher-${{ env.VERSION }}.tar.gz WinterCupLauncher-${{ env.VERSION }}

          for d in WinterCupLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="WinterCupLauncher-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv WinterCupLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in WinterCupLauncher-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="WinterCupLauncher-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv WinterCupLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: WinterCup Launcher ${{ env.VERSION }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            WinterCupLauncher-Linux-x86_64.AppImage
            WinterCupLauncher-Linux-x86_64.AppImage.zsync
            WinterCupLauncher-Linux-aarch64.AppImage
            WinterCupLauncher-Linux-aarch64.AppImage.zsync
            WinterCupLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            WinterCupLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
            WinterCupLauncher-Windows-MinGW-w64-${{ env.VERSION }}.zip
            WinterCupLauncher-Windows-MinGW-w64-Portable-${{ env.VERSION }}.zip
            WinterCupLauncher-Windows-MinGW-w64-Setup-${{ env.VERSION }}.exe
            WinterCupLauncher-Windows-MSVC-arm64-${{ env.VERSION }}.zip
            WinterCupLauncher-Windows-MSVC-arm64-Portable-${{ env.VERSION }}.zip
            WinterCupLauncher-Windows-MSVC-arm64-Setup-${{ env.VERSION }}.exe
            WinterCupLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            WinterCupLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            WinterCupLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe
            WinterCupLauncher-macOS-${{ env.VERSION }}.zip
            WinterCupLauncher-macOS-${{ env.VERSION }}.dmg
            WinterCupLauncher-${{ env.VERSION }}.tar.gz
