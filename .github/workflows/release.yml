name: Build Application and Make Release

on:
  push:
    tags:
      - "*"
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "true"
          path: "WinterLauncher-source"
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/WinterLauncher-source WinterLauncher-${{ env.VERSION }}
          mv WinterLauncher-Linux-Qt6-Portable*/WinterLauncher-portable.tar.gz WinterLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv WinterLauncher-Linux-aarch64-Qt6-Portable*/WinterLauncher-portable.tar.gz WinterLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv WinterLauncher-*.AppImage/WinterLauncher-*-x86_64.AppImage WinterLauncher-Linux-x86_64.AppImage
          mv WinterLauncher-*.AppImage.zsync/WinterLauncher-*-x86_64.AppImage.zsync WinterLauncher-Linux-x86_64.AppImage.zsync
          mv WinterLauncher-*.AppImage/WinterLauncher-*-aarch64.AppImage WinterLauncher-Linux-aarch64.AppImage
          mv WinterLauncher-*.AppImage.zsync/WinterLauncher-*-aarch64.AppImage.zsync WinterLauncher-Linux-aarch64.AppImage.zsync
          mv WinterLauncher-macOS*/WinterLauncher.zip WinterLauncher-macOS-${{ env.VERSION }}.zip
          mv WinterLauncher-macOS*/WinterLauncher.dmg WinterLauncher-macOS-${{ env.VERSION }}.dmg

          tar --exclude='.git' -czf WinterLauncher-${{ env.VERSION }}.tar.gz WinterLauncher-${{ env.VERSION }}

          for d in WinterLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="WinterLauncher-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv WinterLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in WinterLauncher-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="WinterLauncher-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv WinterLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: Winter Launcher ${{ env.VERSION }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            WinterLauncher-Linux-x86_64.AppImage
            WinterLauncher-Linux-x86_64.AppImage.zsync
            WinterLauncher-Linux-aarch64.AppImage
            WinterLauncher-Linux-aarch64.AppImage.zsync
            WinterLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            WinterLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
            WinterLauncher-Windows-MinGW-w64-${{ env.VERSION }}.zip
            WinterLauncher-Windows-MinGW-w64-Portable-${{ env.VERSION }}.zip
            WinterLauncher-Windows-MinGW-w64-Setup-${{ env.VERSION }}.exe
            WinterLauncher-Windows-MSVC-arm64-${{ env.VERSION }}.zip
            WinterLauncher-Windows-MSVC-arm64-Portable-${{ env.VERSION }}.zip
            WinterLauncher-Windows-MSVC-arm64-Setup-${{ env.VERSION }}.exe
            WinterLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            WinterLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            WinterLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe
            WinterLauncher-macOS-${{ env.VERSION }}.zip
            WinterLauncher-macOS-${{ env.VERSION }}.dmg
            WinterLauncher-${{ env.VERSION }}.tar.gz
